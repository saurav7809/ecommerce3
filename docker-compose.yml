name: common-goods
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commongoods
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-store-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d commongoods"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/commongoods
      DATABASE_USER: store
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-store-local-only}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-to-a-long-random-value-1234567890}
      FRONTEND_ORIGIN: http://localhost:5173
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports: ["8080:8080"]
  recommendations:
    build: ./ai-service
    ports: ["8001:8001"]
  storefront:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_AI_URL: http://localhost:8001
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
