server:
  port: ${PORT:8080}
spring:
  application:
    name: common-goods-store
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/commongoods}
    username: ${DATABASE_USER:store}
    password: ${DATABASE_PASSWORD:store-local-only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  sql:
    init:
      mode: never
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-to-a-long-random-value-1234567890}
    expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
